name: Verify complete AuditRepair research release
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  reproduce-stored-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: AuditRepair-v8.3/requirements.txt
      - name: Install pinned scientific CPU dependencies
        run: python -m pip install -r AuditRepair-v8.3/requirements.txt
      - name: Verify archived inputs, checkpoints and results
        run: bash VERIFY_COMPLETE.sh --quick
